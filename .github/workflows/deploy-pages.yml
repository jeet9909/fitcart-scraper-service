name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/static/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public URL of the Render web service, e.g. https://fitcart-scraper-service.onrender.com
      FITCART_API_BASE: ${{ vars.FITCART_API_BASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          if [ -z "$FITCART_API_BASE" ]; then
            echo "::error::Set the FITCART_API_BASE repository variable to your Render service URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          mkdir -p _site/static
          cp app/static/index.html _site/index.html
          cp app/static/api.js _site/static/api.js
          cp app/static/wardrobe.js _site/static/wardrobe.js
          cp app/static/outfit.js _site/static/outfit.js
          printf "window.FITCART_API_BASE = %s;\n" "$(jq -Rn --arg v "${FITCART_API_BASE%/}" '$v')" > _site/static/config.js
          touch _site/.nojekyll
          echo "UI will call: $FITCART_API_BASE"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
