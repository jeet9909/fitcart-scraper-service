<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitCart · Try the whole outfit before you buy</title>
<meta name="description" content="Paste links from Myntra, Amazon, AJIO and more. FitCart puts the whole outfit on you, then sends you to each store to buy.">
<meta name="theme-color" content="#C8175D">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap">
<style>
@property --pos{syntax:'<percentage>';initial-value:50%;inherits:true}
:root{
  color-scheme:light;
  --paper:#F7F5F8; --surface:#FFFFFF; --surface-2:#F1EDF3; --raised:#FFFFFF; --line:#E7E1EA; --line-strong:#CEC6D5;
  --ink:#17121C; --ink-2:#3A3242; --muted:#5F5768;
  --accent:#C8175D; --accent-ink:#FFFFFF; --accent-soft:#FCE8F0; --accent-line:#F2B7CD; --accent-text:#B0124F;
  --teal:#0A7A74; --teal-soft:#DDF3F1;
  --gold:#8A5200; --gold-soft:#FFF0D6;
  --off:#B04A00; --sale:#B42318; --ok:#0F7A4B; --ok-soft:#DFF4E8; --err-soft:#FDE8E7;
  --grad:linear-gradient(115deg,#D81B64 0%,#F0503D 52%,#F59E0B 100%);
  --grad-soft:linear-gradient(115deg,rgba(216,27,100,.14),rgba(240,80,61,.10),rgba(245,158,11,.12));
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.8); --glass-line:rgba(255,255,255,.75);
  --blob-a:rgba(216,27,100,.30); --blob-b:rgba(245,158,11,.26); --blob-c:rgba(10,122,116,.22);
  --gen-figure:rgba(255,255,255,.78); --photo:#D5C0AB; --skeleton:#E9E4EC; --skeleton-hi:#F6F3F8;
  --shadow-s:0 1px 2px rgba(23,18,28,.06);
  --shadow:0 1px 2px rgba(23,18,28,.05),0 10px 30px -8px rgba(23,18,28,.12);
  --shadow-float:0 2px 6px rgba(23,18,28,.06),0 22px 48px -14px rgba(60,20,50,.28);
  --glow:0 10px 30px -10px rgba(216,27,100,.55);
  --scrim:rgba(23,18,28,.45);
  --r-s:10px; --r-m:14px; --r-l:22px;
  --display:"Syne","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.5,0,.75,0); --spring:cubic-bezier(.34,1.4,.64,1);
  --tab-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --z-bar:20; --z-float:25; --z-sheet:40; --z-toast:50;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0D0911; --surface:#16101C; --surface-2:#211828; --raised:#1C1523; --line:#2E2437; --line-strong:#46394F;
    --ink:#F7F2F8; --ink-2:#DDD3E2; --muted:#AFA4B8;
    --accent:#FF5C98; --accent-ink:#1A0611; --accent-soft:#3B1429; --accent-line:#6E2449; --accent-text:#FF7AAC;
    --teal:#3ED9CB; --teal-soft:#0F2E2C;
    --gold:#FFC24A; --gold-soft:#35270C;
    --off:#FF9B55; --sale:#FF8A80; --ok:#4FD49A; --ok-soft:#10301F; --err-soft:#3A1717;
    --grad:linear-gradient(115deg,#FF4D8D 0%,#FF7A45 52%,#FFC24A 100%);
    --grad-soft:linear-gradient(115deg,rgba(255,77,141,.18),rgba(255,122,69,.12),rgba(255,194,74,.14));
    --glass:rgba(28,21,35,.55); --glass-strong:rgba(28,21,35,.78); --glass-line:rgba(255,255,255,.09);
    --blob-a:rgba(255,77,141,.34); --blob-b:rgba(255,160,60,.22); --blob-c:rgba(62,217,203,.20);
    --gen-figure:rgba(255,255,255,.2); --photo:#2C2721; --skeleton:#241B2B; --skeleton-hi:#302538;
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -8px rgba(0,0,0,.55);
    --shadow-float:0 2px 6px rgba(0,0,0,.4),0 22px 48px -14px rgba(0,0,0,.75);
    --glow:0 10px 34px -8px rgba(255,77,141,.6);
    --scrim:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0D0911; --surface:#16101C; --surface-2:#211828; --raised:#1C1523; --line:#2E2437; --line-strong:#46394F;
  --ink:#F7F2F8; --ink-2:#DDD3E2; --muted:#AFA4B8;
  --accent:#FF5C98; --accent-ink:#1A0611; --accent-soft:#3B1429; --accent-line:#6E2449; --accent-text:#FF7AAC;
  --teal:#3ED9CB; --teal-soft:#0F2E2C;
  --gold:#FFC24A; --gold-soft:#35270C;
  --off:#FF9B55; --sale:#FF8A80; --ok:#4FD49A; --ok-soft:#10301F; --err-soft:#3A1717;
  --grad:linear-gradient(115deg,#FF4D8D 0%,#FF7A45 52%,#FFC24A 100%);
  --grad-soft:linear-gradient(115deg,rgba(255,77,141,.18),rgba(255,122,69,.12),rgba(255,194,74,.14));
  --glass:rgba(28,21,35,.55); --glass-strong:rgba(28,21,35,.78); --glass-line:rgba(255,255,255,.09);
  --blob-a:rgba(255,77,141,.34); --blob-b:rgba(255,160,60,.22); --blob-c:rgba(62,217,203,.20);
  --gen-figure:rgba(255,255,255,.2); --photo:#2C2721; --skeleton:#241B2B; --skeleton-hi:#302538;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -8px rgba(0,0,0,.55);
  --shadow-float:0 2px 6px rgba(0,0,0,.4),0 22px 48px -14px rgba(0,0,0,.75);
  --glow:0 10px 34px -8px rgba(255,77,141,.6);
  --scrim:rgba(0,0,0,.62);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:500 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;transition:background-color .3s var(--ease),color .3s var(--ease)}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
button,a,label,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.s{width:16px;height:16px}

/* ---------- Shell ---------- */
.topbar{position:sticky;top:0;z-index:var(--z-bar);background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.topbar-in{max-width:1120px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font:800 22px/1 var(--display);letter-spacing:-.02em;color:var(--ink);text-decoration:none;min-height:44px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--grad);color:#fff;box-shadow:var(--glow);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.toptabs{display:none;gap:4px;margin-left:24px}
.toptabs button{height:40px;padding:0 16px;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted);transition:background-color .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.toptabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toptabs button:hover{color:var(--ink)}
.spacer{flex:1}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);transition:background-color .2s var(--ease),transform .15s var(--ease)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:active{transform:scale(.94)}
.lookpill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 14px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;transition:transform .15s var(--ease),filter .2s}
.lookpill:hover{filter:brightness(1.15)}
.lookpill:active{transform:scale(.96)}
.lookpill .count{background:var(--grad);color:#fff;min-width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:13px}
.lookpill .count.bump{animation:bump .4s var(--spring)}
@keyframes bump{40%{transform:scale(1.35)}}
.proto{max-width:1120px;margin:0 auto;padding:8px 16px 0;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
main{max-width:1120px;margin:0 auto;padding:12px 16px calc(var(--tab-h) + 110px + var(--safe-b))}
main:focus{outline:none}
.view-enter{animation:viewin .32s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-bar);background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-left,0px)) var(--safe-b) max(8px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(3,1fr)}
.tabbar button{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);position:relative;transition:color .2s var(--ease)}
.tabbar button .icon{transition:transform .25s var(--spring)}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] .icon{transform:translateY(-1px) scale(1.08)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge-dot{position:absolute;top:9px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;display:grid;place-items:center}

/* ---------- Primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-m);font-weight:800;font-size:16px;background:var(--accent);color:var(--accent-ink);transition:filter .2s var(--ease),background-color .2s var(--ease),transform .15s var(--ease),box-shadow .2s var(--ease);text-decoration:none;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 6px 16px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.42;box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--shadow-s)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);filter:none}
.btn.quiet{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.small{min-height:44px;padding:0 16px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.link{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2);transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),transform .15s var(--ease)}
.chip:hover{border-color:var(--ink-2)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.add{border-style:dashed;color:var(--accent);border-color:var(--accent-line);background:transparent}
.chip.add:hover{background:var(--accent-soft);border-color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;letter-spacing:.02em;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.tag.ai{background:var(--gold-soft);color:var(--gold)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.private{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ok);background:var(--ok-soft);padding:5px 10px 5px 8px;border-radius:999px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
.field{display:grid;gap:6px;font-weight:700;font-size:14px}
.input{width:100%;min-height:52px;border-radius:var(--r-m);border:1px solid var(--line-strong);background:var(--surface);padding:0 16px;font-size:16px;font-weight:600;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.error{color:var(--sale);font-weight:700;font-size:14px}
.error:empty{display:none}
.price{font-weight:800;font-variant-numeric:tabular-nums}
.mrp{color:var(--muted);text-decoration:line-through;font-weight:600;font-variant-numeric:tabular-nums}
.off{color:var(--off);font-weight:800}

/* ---------- Home ---------- */
.hero{display:grid;gap:28px;padding:20px 0 8px}
.hero-copy{display:grid;gap:20px}
.hero h1{font:800 clamp(36px,9vw,64px)/1 var(--display);letter-spacing:-.035em}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{font-size:18px;color:var(--ink-2);max-width:34ch}
.linkbox{display:grid;gap:10px}
.linkrow{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;padding:6px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.linkrow:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
.linkrow input{flex:1;min-width:0;border:0;background:transparent;padding:0 10px;font-size:16px;font-weight:600;min-height:48px}
.linkrow input:focus{outline:none}
.stores{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px;color:var(--muted)}
.stores b{color:var(--ink-2);font-weight:800}
.trust{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.trust span{display:inline-flex;gap:6px;align-items:center}
.steps3{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps3 li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:14px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line)}
.steps3 li::before{counter-increment:s;content:counter(s);width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 18px/1 var(--display)}
.steps3 strong{display:block}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 12px}
.section-title h2{font:800 24px/1.1 var(--display);letter-spacing:-.02em}

/* ---------- Compare slider ---------- */
.compare{--pos:50%;position:relative;border-radius:var(--r-l);overflow:hidden;background:var(--photo);aspect-ratio:3/4;width:100%;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow);isolation:isolate}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.compare .after-wrap{position:absolute;inset:0;clip-path:inset(0 0 0 var(--pos))}
.compare .divider{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;background:rgba(255,255,255,.95);transform:translateX(-1px);pointer-events:none;box-shadow:0 0 12px rgba(0,0,0,.25)}
.compare .knob{position:absolute;top:50%;left:var(--pos);width:52px;height:52px;border-radius:50%;background:#fff;color:#15161A;transform:translate(-50%,-50%);box-shadow:0 6px 20px rgba(0,0,0,.28);display:grid;place-items:center;pointer-events:none;transition:transform .2s var(--ease)}
.compare .knob svg{width:24px;height:24px}
.compare input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;z-index:2}
.compare input[type=range]:focus-visible ~ .knob{outline:3px solid var(--accent);outline-offset:4px}
.compare.dragging .knob{transform:translate(-50%,-50%) scale(1.08)}
.compare .lbl{position:absolute;top:14px;padding:6px 11px;border-radius:999px;background:rgba(15,16,20,.72);backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:800;letter-spacing:.04em;pointer-events:none;transition:opacity .2s var(--ease)}
.compare .lbl.l{left:14px}.compare .lbl.r{right:14px}
.compare.nudge{animation:nudge 1.6s var(--ease) .5s 1}
@keyframes nudge{0%,100%{--pos:50%}35%{--pos:62%}70%{--pos:42%}}

/* ---------- Builder ---------- */
.builder{display:grid;gap:18px}
.page-head{display:flex;align-items:end;justify-content:space-between;gap:12px;padding-top:8px}
.page-head h1{font:800 32px/1 var(--display);letter-spacing:-.03em}
.slots{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:12px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-s);animation:slotin .35s var(--ease)}
@keyframes slotin{from{opacity:0;transform:translateY(6px) scale(.99)}}
.slot .thumb{width:84px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--photo)}
.slot .thumb img{width:100%;height:100%;object-fit:cover}
.slot-body{display:grid;gap:6px;min-width:0}
.slot-top{display:flex;align-items:center;gap:8px;justify-content:space-between;min-height:28px}
.slot-top .iconbtn{margin:-10px -8px -10px 0}
.slot-name{font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pricerow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.slots.compact{gap:8px}
.slots.compact .slot{grid-template-columns:64px 1fr;gap:12px;padding:10px 10px 10px 10px}
.slots.compact .slot .thumb{width:64px}
.slots.compact .slot-name{-webkit-line-clamp:1}
.slots.compact .sizes{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding-bottom:2px;margin-right:-10px;padding-right:10px}
.slots.compact .sizes::-webkit-scrollbar{display:none}
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.size{position:relative;min-width:48px;height:44px;padding:0 12px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;scroll-snap-align:start;flex-shrink:0;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .12s var(--ease)}
.size:hover:not(:disabled){border-color:var(--ink)}
.size:active:not(:disabled){transform:scale(.95)}
.size[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.size:disabled{color:var(--muted);border-style:dashed;background:linear-gradient(to top right,transparent calc(50% - .75px),var(--line-strong) calc(50% - .75px),var(--line-strong) calc(50% + .75px),transparent calc(50% + .75px)) var(--surface-2)}
.size-note{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);align-items:center}
.size-note .need{color:var(--gold);font-weight:800;display:inline-flex;gap:5px;align-items:center}
.size-note .picked{color:var(--ok);font-weight:800;display:inline-flex;gap:5px;align-items:center}
.more{display:grid;gap:10px;padding:14px;border-radius:var(--r-l);border:1px dashed var(--line-strong)}
.more .chips{flex-wrap:wrap;overflow:visible}
.empty{display:grid;justify-items:center;text-align:center;gap:14px;padding:28px 18px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line)}
.empty svg.art{width:148px;height:112px}
.empty h2{font:800 22px/1.15 var(--display)}
.empty p{max-width:32ch}
.empty .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.summary{position:sticky;bottom:calc(var(--tab-h) + var(--safe-b) + 10px);z-index:var(--z-float);display:flex;align-items:center;gap:14px;justify-content:space-between;padding:10px 10px 10px 18px;border-radius:20px;background:color-mix(in srgb,var(--raised) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow-float)}
.summary .total{font:800 22px/1.1 var(--body);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.summary .meta{font-size:13px;color:var(--muted);font-weight:700}
.side{display:none}
.panel{padding:20px;display:grid;gap:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-head h2{font:800 22px/1.1 var(--display)}
.person{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}
.person img{width:84px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--photo)}
.panel-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2)}
.panel-total .total{font:800 22px/1 var(--body);font-variant-numeric:tabular-nums}

/* Pose + consent */
.poses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pose{position:relative;display:grid;gap:6px;padding:12px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .2s var(--ease),background-color .2s var(--ease),transform .15s var(--ease)}
.pose:active{transform:scale(.98)}
.pose:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pose:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.pose input{position:absolute;opacity:0}
.pose .check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:transparent;transition:all .2s var(--ease)}
.pose:has(input:checked) .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pose svg.fig{width:44px;height:56px;color:var(--ink-2)}
.pose strong{font-size:14px}
.pose span.d{font-size:12px;color:var(--muted);line-height:1.4}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ink-2);cursor:pointer;min-height:44px}
.consent input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex-shrink:0}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tip{display:grid;gap:6px;justify-items:center;text-align:center;font-size:12px;font-weight:700;color:var(--ink-2);padding:10px 6px;border-radius:12px;background:var(--surface-2)}
.tip svg{width:26px;height:26px;color:var(--ok)}

/* ---------- Sheets ---------- */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:24px 24px 0 0;background:var(--surface);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.2);overflow:auto;overscroll-behavior:contain;padding-bottom:var(--safe-b)}
dialog.sheet::backdrop{background:var(--scrim);animation:fade .25s var(--ease)}
dialog.sheet[open]{animation:sheetup .32s var(--ease)}
dialog.sheet.closing{animation:sheetdown .22s var(--ease-in) forwards}
dialog.sheet.closing::backdrop{animation:fade .22s var(--ease-in) reverse forwards}
@keyframes sheetup{from{transform:translateY(100%)}}
@keyframes sheetdown{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.sheet-head{position:sticky;top:0;z-index:1;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 12px 10px 20px;border-bottom:1px solid var(--line)}
.sheet-head h2{font:800 20px/1.2 var(--display)}
.sheet-body{padding:18px 20px 24px;display:grid;gap:16px}
.grabber{width:40px;height:5px;border-radius:5px;background:var(--line-strong);margin:8px auto 4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{min-height:44px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted);transition:background-color .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.skeleton{display:grid;grid-template-columns:96px 1fr;gap:14px}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--skeleton),var(--skeleton-hi),var(--skeleton));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.preview{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;animation:viewin .3s var(--ease)}
.preview img{width:96px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--photo)}
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{display:grid;gap:6px;text-align:left;font-size:13px;font-weight:700}
.pick img{aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--photo);border:2px solid transparent;transition:border-color .2s var(--ease)}
.pick:hover img{border-color:var(--accent)}
.drop{display:grid;place-items:center;gap:8px;padding:28px 16px;border-radius:var(--r-m);border:1.5px dashed var(--line-strong);text-align:center;cursor:pointer;color:var(--ink-2);width:100%;transition:border-color .2s var(--ease),background-color .2s var(--ease)}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2);font-size:14px;color:var(--ink-2)}

/* ---------- Generating ---------- */
.gen{display:grid;gap:18px;padding-top:8px}
.gen-stage{display:grid;justify-items:center;gap:12px}
.gen-visual{position:relative;width:min(300px,64vw,calc((100svh - 420px) * .75));min-width:180px;aspect-ratio:3/4;border-radius:var(--r-l);overflow:hidden;background:var(--photo);box-shadow:var(--shadow-float);isolation:isolate;transition:transform .6s var(--spring),box-shadow .6s var(--ease)}
.gen-visual .layer{position:absolute;inset:0;transition:opacity .7s var(--ease),filter .9s var(--ease),transform 1.2s var(--ease)}
.gen-visual .layer img{width:100%;height:100%;object-fit:cover}
.l-photo{filter:blur(6px) saturate(.85);transform:scale(1.06)}
/* Loader: the person's photo stays under a frosted glass pane with a shimmering silhouette until the result arrives. */
.l-aura{opacity:.55;overflow:hidden;filter:blur(28px)}
.l-aura i{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;animation:aura 7s var(--ease) infinite alternate}
.l-aura i:nth-child(1){left:-18%;top:-10%;background:var(--blob-a)}
.l-aura i:nth-child(2){right:-22%;top:30%;background:var(--blob-b);animation-delay:-2.3s;animation-duration:8s}
.l-aura i:nth-child(3){left:10%;bottom:-24%;background:var(--blob-c);animation-delay:-4.6s;animation-duration:9s}
@keyframes aura{to{transform:translate(14%,-10%) scale(1.18)}}
.l-glass{display:grid;place-items:end center;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--glass-line) 45%,transparent),transparent 42%),var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:inset 0 0 0 1px var(--glass-line);opacity:.4}
.l-glass svg{width:62%;height:auto;color:var(--gen-figure);opacity:.35;transition:opacity .8s var(--ease),transform 1.2s var(--ease);transform:translateY(4%)}
.l-glass::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,#fff 30%,transparent) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 1.8s var(--ease) infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.l-soft,.l-sharp{visibility:hidden}
.l-soft{opacity:0;filter:blur(26px) saturate(1.1);transform:scale(1.1)}
.l-sharp{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s var(--ease)}
.l-scan{opacity:0;pointer-events:none}
.l-scan::before{content:"";position:absolute;left:0;right:0;top:0;height:26%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 32%,transparent) 70%,color-mix(in srgb,#fff 70%,transparent) 96%,transparent);filter:blur(2px)}
.gen-visual.p2 .l-photo{filter:blur(12px) saturate(.8)}
.gen-visual.p2 .l-glass,.gen-visual.p3 .l-glass{opacity:1}
.gen-visual.p2 .l-glass svg{opacity:.75;transform:none}
.gen-visual.p2 .l-aura{opacity:.8}
.gen-visual.p3 .l-photo{filter:blur(16px) saturate(.8)}
.gen-visual.p3 .l-aura{opacity:1}
.gen-visual.p3 .l-glass svg{opacity:.9;transform:none;animation:breathe 2.4s var(--ease) infinite}
@keyframes breathe{50%{opacity:.6;transform:scale(.985)}}
.gen-visual.p3 .l-scan{opacity:.55}
.gen-visual.p3 .l-scan::before{animation:scan 2.6s var(--ease) infinite}
.gen-visual.p4 .l-photo,.gen-visual.p4 .l-glass,.gen-visual.p4 .l-aura{opacity:0}
.gen-visual.p4 .l-soft,.gen-visual.p4 .l-sharp{visibility:visible}
.gen-visual.p4 .l-soft{opacity:1;filter:blur(10px);transform:scale(1.02)}
.gen-visual.p4 .l-sharp{clip-path:inset(0 0 0 0)}
.gen-visual.p4 .l-scan{opacity:1;animation:scan 1.1s var(--ease) forwards}
.gen-visual.p4 .l-scan::before{animation:none}
@keyframes scan{from{transform:translateY(-26%)}to{transform:translateY(100%)}}
.gen-visual.done{transform:scale(1.02);box-shadow:0 0 0 1px var(--accent-line),0 24px 60px -18px color-mix(in srgb,var(--accent) 55%,transparent)}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:3}
.confetti i{position:absolute;left:50%;top:48%;width:8px;height:12px;border-radius:2px;background:var(--c);opacity:0}
.gen-visual.done .confetti i{animation:pop 1s var(--ease) var(--d) forwards}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.3) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r))}}
.gen-title{font:800 28px/1.1 var(--display);text-align:center;letter-spacing:-.02em}
.gen-side{display:grid;gap:16px;align-content:start;width:min(420px,100%);justify-self:center}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.stages li{display:flex;gap:12px;align-items:center;min-height:40px;font-weight:700;color:var(--muted);transition:color .3s var(--ease)}
.stages .dot{position:relative;width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;flex-shrink:0;transition:background-color .3s var(--ease),border-color .3s var(--ease)}
.stages li.done{color:var(--ink)}
.stages li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff;animation:tick .35s var(--spring)}
@keyframes tick{from{transform:scale(.6)}}
.stages li.now{color:var(--ink)}
.stages li.now .dot{border-color:var(--accent-line)}
.stages li.now .dot::before{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);animation:spin .8s linear infinite}
.stages li.now .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s var(--ease) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.55);opacity:.55}}
.gen-foot{position:sticky;bottom:calc(var(--tab-h) + var(--safe-b) + 10px);z-index:var(--z-float);display:grid;gap:10px;padding:14px;border-radius:20px;background:color-mix(in srgb,var(--raised) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow-float)}
.progress{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;width:100%;border-radius:6px;background:var(--grad);transform-origin:left;transform:scaleX(0);transition:transform .5s linear}
.gen-foot-row{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- Result ---------- */
.result{display:grid;gap:18px}
.result-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;justify-content:space-between;padding-top:8px}
.result-head h1{font:800 32px/1.02 var(--display);letter-spacing:-.03em}
.result-visual{display:grid;gap:10px}
.result-visual.celebrate .compare{animation:settle .7s var(--spring)}
@keyframes settle{from{transform:scale(.96);opacity:.4}}
.shop{padding:18px;display:grid;gap:4px;box-shadow:var(--shadow)}
.shop h2{font:800 22px/1.15 var(--display)}
.shop-row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.shop-row:last-of-type{border-bottom:0}
.shop-row img{width:56px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--photo)}
.shop-row .n{font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shop-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;border-top:1px solid var(--line-strong);margin-top:4px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.action{display:grid;justify-items:center;align-content:center;gap:4px;padding:8px 4px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--ink-2);min-height:64px;transition:background-color .2s var(--ease),transform .15s var(--ease)}
.action:hover{background:var(--surface-2)}
.action:active{transform:scale(.96)}
.feedback{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px}
.thumbs{display:flex;gap:8px}

/* ---------- Wardrobe & Looks ---------- */
.stylist{padding:18px;display:grid;gap:12px;border-color:var(--accent-line);background:var(--grad-soft),var(--surface)}
.stylist h2{font:800 22px/1.1 var(--display)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:-2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex-shrink:0}
.ideas{display:grid;gap:10px}
.idea{display:grid;gap:10px;padding:14px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);animation:viewin .35s var(--ease) backwards}
.idea:nth-child(2){animation-delay:.08s}
.idea-thumbs{display:flex;gap:6px}
.idea-thumbs img{width:56px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--photo)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.item{display:grid;gap:8px;align-content:start}
.item .ph{position:relative;border-radius:var(--r-m);overflow:hidden;background:var(--photo);aspect-ratio:3/4}
.item .ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.item:hover .ph img{transform:scale(1.03)}
.item .ph .tag{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.94);color:#15161A}
.item .add{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow);transition:background-color .2s var(--ease),color .2s var(--ease),transform .15s var(--ease)}
.item .add:active{transform:scale(.9)}
.item .add[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.item-name{font-weight:700;font-size:14px;line-height:1.3}
.looks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.look{display:grid;gap:8px;text-align:left;border-radius:var(--r-m)}
.look img{aspect-ratio:3/4;object-fit:cover;border-radius:var(--r-m);background:var(--photo);transition:transform .3s var(--ease)}
.look:hover img{transform:translateY(-2px)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;top:calc(72px + var(--safe-t));z-index:var(--z-toast);width:min(440px,calc(100% - 32px));display:flex;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:16px;background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;box-shadow:var(--shadow-float);transform:translate(-50%,0);animation:toastin .32s var(--spring)}
.toast.leaving{animation:toastout .2s var(--ease-in) forwards}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-14px) scale(.97)}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,-10px) scale(.98)}}
.toast .ti{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--paper) 16%,transparent)}
.toast.success .ti{background:var(--ok);color:#fff}
.toast.error .ti{background:var(--sale);color:#fff}
.toast .tx{flex:1;line-height:1.35}
.toast .ta{min-height:40px;padding:0 14px;border-radius:10px;font-weight:800;font-size:14px;color:var(--paper);background:color-mix(in srgb,var(--paper) 16%,transparent)}
.toast .ta:hover{background:color-mix(in srgb,var(--paper) 26%,transparent)}

@media (min-width:960px){
  .toptabs{display:flex}
  .tabbar{display:none}
  main{padding-bottom:72px}
  .toast{top:auto;bottom:28px;animation-name:toastinb}
  @keyframes toastinb{from{opacity:0;transform:translate(-50%,14px) scale(.97)}}
  .hero{grid-template-columns:1.05fr .95fr;align-items:center;gap:56px;padding:40px 0 16px}
  .hero-visual{max-width:440px;justify-self:end;width:100%}
  .steps3{grid-template-columns:repeat(3,1fr)}
  .builder{grid-template-columns:minmax(0,1.3fr) minmax(340px,.9fr);align-items:start;gap:32px}
  .builder>.page-head{grid-column:1/-1}
  .side{display:block;position:sticky;top:84px}
  .side .panel{box-shadow:var(--shadow-float);border-color:var(--line)}
  .builder .summary{display:none}
  .gen{grid-template-columns:auto minmax(320px,420px);justify-content:center;align-items:center;gap:56px;min-height:calc(100vh - 160px)}
  .gen-visual{width:min(380px,calc((100vh - 200px) * .75))}
  .gen-foot{position:static;box-shadow:var(--shadow)}
  .result{grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);align-items:start;gap:32px}
  .result-head{grid-column:1/-1}
  .result-visual{position:sticky;top:84px}
  .result-visual .compare{height:min(calc(100vh - 170px),760px);min-height:520px;width:auto;max-width:100%;margin-inline:auto}
  .grid,.looks{grid-template-columns:repeat(4,1fr)}
  .ideas{grid-template-columns:1fr 1fr}
  dialog.sheet{margin:auto;border-radius:24px;max-height:86vh}
  dialog.sheet[open]{animation:pop-in .26s var(--ease)}
  dialog.sheet.closing{animation:pop-out .18s var(--ease-in) forwards}
  @keyframes pop-in{from{opacity:0;transform:translateY(12px) scale(.98)}}
  @keyframes pop-out{to{opacity:0;transform:translateY(8px) scale(.98)}}
  .grabber{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .l-glass::after,.l-aura i,.gen-visual .confetti,.l-scan{display:none}
}

/* ---------- v4: brand, glass, marketing ---------- */
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--glass-line)}
.grad-text{background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradshift 8s ease-in-out infinite alternate}
@keyframes gradshift{to{background-position:100% 0}}
.btn.brand{background:var(--grad);background-size:160% 100%;color:#fff;box-shadow:var(--glow);position:relative;overflow:hidden;transition:background-position .5s var(--ease),transform .15s var(--ease),box-shadow .2s var(--ease)}
.btn.brand:hover:not(:disabled){filter:none;background-position:100% 0}
.btn.brand::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.5s var(--ease) 1.5s infinite}
@keyframes shine{0%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}
.btn.glassy{background:var(--glass);color:var(--ink);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow-s)}
.btn.glassy:hover:not(:disabled){filter:none;background:var(--glass-strong)}
.btn.big{min-height:56px;padding:0 26px;font-size:17px;border-radius:16px}

.landing{display:grid;gap:0;width:100vw;margin:-12px 0 0 calc(50% - 50vw)}
.landing>section{padding:0 16px}
.lp-hero{position:relative;overflow:hidden;padding:36px 16px 56px!important;isolation:isolate}
.aurora{position:absolute;inset:-20% -10% -10%;z-index:-1;pointer-events:none;filter:blur(60px)}
.aurora i{position:absolute;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:52vw;height:52vw;max-width:620px;max-height:620px;left:-8%;top:4%;background:var(--blob-a)}
.aurora i:nth-child(2){width:44vw;height:44vw;max-width:520px;max-height:520px;right:-6%;top:-6%;background:var(--blob-b);animation-duration:22s;animation-delay:-6s}
.aurora i:nth-child(3){width:40vw;height:40vw;max-width:480px;max-height:480px;left:36%;bottom:-18%;background:var(--blob-c);animation-duration:26s;animation-delay:-12s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.12)}100%{transform:translate(-6%,-4%) scale(.94)}}
.lp-grid{max-width:1120px;margin:0 auto;display:grid;gap:40px;align-items:center}
.lp-copy{display:grid;gap:22px;justify-items:start}
.pill-new{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;font-size:13px;font-weight:800;color:var(--ink-2)}
.pill-new b{padding:3px 9px;border-radius:999px;background:var(--grad);color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.lp-copy h1{font:800 clamp(44px,11.5vw,88px)/.95 var(--display);letter-spacing:-.045em}
.lp-copy .lede{font-size:clamp(17px,2.4vw,20px);color:var(--ink-2);max-width:36ch}
.lp-ctas{display:flex;flex-wrap:wrap;gap:12px}
.lp-trust{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);font-weight:600}
.lp-trust span{display:inline-flex;gap:6px;align-items:center}
.lp-trust svg{color:var(--teal)}
.stage{position:relative;width:min(360px,78vw);justify-self:center;padding:26px 0}
.device{position:relative;border-radius:34px;padding:10px;box-shadow:var(--shadow-float);animation:rise .9s var(--ease) both}
.device .compare{border-radius:26px;box-shadow:none}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}}
.floater{position:absolute;display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;border-radius:16px;box-shadow:var(--shadow-float);font-size:13px;font-weight:700;line-height:1.25;animation:float-in .7s var(--spring) both,bob 6s ease-in-out infinite alternate;animation-delay:var(--d,0s),calc(var(--d,0s) + .7s);z-index:2;max-width:210px}
.floater img{width:40px;height:52px;object-fit:cover;border-radius:10px;background:var(--photo)}
.floater small{display:block;color:var(--muted);font-weight:700;font-size:11px}
.floater .p{color:var(--accent-text)}
.f1{left:-22%;top:24%;--d:.35s}.f2{right:-20%;top:40%;--d:.55s}.f3{left:-16%;bottom:14%;--d:.75s}
.f-look{right:-10%;bottom:-2%;--d:1s;padding:10px 14px}
.f-look b{font-size:16px}
@keyframes float-in{from{opacity:0;transform:translateY(12px) scale(.9)}}
@keyframes bob{to{transform:translateY(-10px)}}
.marquee{overflow:hidden;border-block:1px solid var(--line);padding:18px 0!important;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marquee-track{display:flex;gap:48px;width:max-content;animation:marq 32s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span{font:800 22px/1 var(--display);color:var(--muted);letter-spacing:-.01em;white-space:nowrap;display:inline-flex;align-items:center;gap:48px}
.marquee-track span::after{content:"✦";font-size:14px;color:var(--accent)}
@keyframes marq{to{transform:translateX(-50%)}}
.lp-section{width:min(1120px,100%);margin:0 auto;padding:72px 0 0!important;display:grid;gap:26px}
.lp-head{display:grid;gap:10px;max-width:640px}
.lp-head h2{font:800 clamp(30px,6vw,48px)/1.02 var(--display);letter-spacing:-.035em}
.lp-head p{font-size:17px;color:var(--ink-2)}
.flow{display:grid;gap:14px;counter-reset:f;list-style:none;margin:0;padding:0}
.flow li{position:relative;display:grid;gap:8px;padding:22px;border-radius:var(--r-l);box-shadow:var(--shadow-s)}
.flow li::before{counter-increment:f;content:"0" counter(f);font:800 14px/1 var(--display);letter-spacing:.08em;color:var(--accent-text)}
.flow h3{font:800 21px/1.15 var(--display)}
.bento{display:grid;gap:14px;grid-template-columns:1fr}
.bento article{position:relative;overflow:hidden;display:grid;gap:10px;align-content:start;padding:22px;border-radius:var(--r-l);box-shadow:var(--shadow-s);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.bento article:hover{transform:translateY(-3px);box-shadow:var(--shadow-float)}
.bento .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.bento .ico.t{background:var(--teal-soft);color:var(--teal)}
.bento .ico.g{background:var(--gold-soft);color:var(--gold)}
.bento h3{font:800 20px/1.15 var(--display)}
.bento p{color:var(--ink-2);font-size:15px}
.bento .hero-card{background:var(--grad);color:#fff;border:0}
.bento .hero-card p,.bento .hero-card h3{color:#fff}
.bento .hero-card .ico{background:rgba(255,255,255,.2);color:#fff}
.bento .stack{display:flex;margin-top:4px}
.bento .stack img{width:58px;height:74px;object-fit:cover;border-radius:12px;border:3px solid rgba(255,255,255,.85);margin-right:-14px;background:var(--photo);box-shadow:var(--shadow)}
.soon{justify-self:start;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.showcase{display:grid;gap:22px;align-items:center}
.showcase .compare{max-width:420px;justify-self:center}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start;font-weight:600;color:var(--ink-2)}
.checks li svg{color:var(--teal);margin-top:3px}
.faq{display:grid;gap:10px}
.faq details{border-radius:var(--r-m);padding:0 18px;box-shadow:var(--shadow-s)}
.faq summary{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:600 24px/1 var(--body);color:var(--accent-text);transition:transform .25s var(--ease)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 16px;color:var(--ink-2)}
.cta-band{position:relative;overflow:hidden;width:min(1120px,calc(100% - 32px));margin:72px auto 0;padding:40px 24px!important;border-radius:28px;background:var(--grad);color:#fff;display:grid;gap:16px;justify-items:start;isolation:isolate}
.cta-band::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;top:-180px;background:rgba(255,255,255,.18);z-index:-1}
.cta-band h2{font:800 clamp(30px,6vw,46px)/1 var(--display);letter-spacing:-.03em;max-width:18ch}
.cta-band .btn{background:#fff;color:#17121C;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.lp-foot{width:min(1120px,100%);margin:40px auto 0;padding:24px 16px 8px!important;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;color:var(--muted);font-size:14px}
.reveal{transition:opacity .7s var(--ease),transform .7s var(--ease)}
.js-reveal .reveal:not(.in){opacity:0;transform:translateY(22px)}

/* ---------- Pricing ---------- */
.pricing{display:grid;gap:22px}
.billing{justify-self:start;display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:14px}
.billing button{min-height:44px;padding:0 16px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted);display:inline-flex;gap:8px;align-items:center;transition:background-color .2s var(--ease),color .2s var(--ease)}
.billing button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.billing .save{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.tiers{display:grid;gap:14px;grid-template-columns:1fr}
.tier{position:relative;display:grid;gap:14px;align-content:start;padding:22px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-s);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.tier:hover{transform:translateY(-3px);box-shadow:var(--shadow-float)}
.tier.pop{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;box-shadow:var(--glow)}
.tier .ribbon{position:absolute;top:-12px;left:22px;padding:4px 12px;border-radius:999px;background:var(--grad);color:#fff;font-size:12px;font-weight:800;letter-spacing:.02em}
.tier h3{font:800 22px/1.1 var(--display)}
.tier .for{font-size:14px;color:var(--muted);min-height:2.6em}
.tier .amt{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tier .amt b{font:800 40px/1 var(--body);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tier .amt span{color:var(--muted);font-weight:700}
.tier .per{font-size:13px;font-weight:800;color:var(--teal)}
.tier .was{font-size:13px;color:var(--muted);text-decoration:line-through}
.tier ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14px;color:var(--ink-2)}
.tier li{display:flex;gap:9px;align-items:flex-start}
.tier li svg{color:var(--ok);margin-top:2px}
.tier li.no{color:var(--muted)}
.tier li.no svg{color:var(--line-strong)}
.plan-table{overflow-x:auto;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface)}
.plan-table table{width:100%;min-width:620px;border-collapse:collapse;font-size:14px}
.plan-table th,.plan-table td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.plan-table thead th{font-weight:800;background:var(--surface-2)}
.plan-table tbody th{font-weight:700;color:var(--ink-2)}
.plan-table td.hi{background:var(--accent-soft)}
.plan-notes{display:grid;gap:8px;font-size:13px;color:var(--muted)}
.plan-chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-size:13px;font-weight:800}

@media (min-width:700px){
  .bento{grid-template-columns:repeat(2,1fr)}
  .flow{grid-template-columns:repeat(3,1fr)}
  .tiers{grid-template-columns:repeat(2,1fr)}
  .cta-band{padding:56px!important}
}
@media (min-width:960px){
  .lp-hero{padding:64px 16px 88px!important}
  .lp-grid{grid-template-columns:1.1fr .9fr;gap:56px}
  .stage{width:360px}
  .bento{grid-template-columns:repeat(3,1fr)}
  .bento .wide{grid-column:span 2}
  .showcase{grid-template-columns:1fr 1fr;gap:56px}
  .tiers{grid-template-columns:repeat(4,1fr)}
  .tier.pop{transform:translateY(-8px)}
  .tier.pop:hover{transform:translateY(-11px)}
}
@media (max-width:520px){
  .f1{left:-6%;top:4%}.f2{right:-6%}.f3{left:-4%}.f-look{right:-4%}
  .floater{max-width:170px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .aurora i,.marquee-track,.grad-text,.btn.brand::after,.floater{animation:none!important}
  .js-reveal .reveal:not(.in){opacity:1;transform:none}
}

/* ---------- live app additions ---------- */
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px}
.slot-cat{min-height:32px;max-width:132px;padding:0 26px 0 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:800;cursor:pointer}
.slot-links{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.slot-links .link{min-height:36px}
.chip.mini{min-height:36px;padding:0 12px;font-size:13px}
.item .del{position:absolute;right:8px;top:8px;min-width:36px;height:36px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.92);color:#17121C;display:grid;place-items:center;font-size:12px;font-weight:800;box-shadow:var(--shadow-s);opacity:.9;transition:background-color .2s var(--ease),color .2s var(--ease)}
.item .del.confirm{background:var(--sale);color:#fff;opacity:1}
.imgpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.imgpick button{flex-shrink:0;border-radius:12px;border:2px solid var(--line);overflow:hidden;padding:0;transition:border-color .2s var(--ease)}
.imgpick button[aria-pressed="true"]{border-color:var(--accent)}
.imgpick img{width:56px;height:72px;object-fit:cover;display:block;background:var(--photo)}
.ph-slot{width:56px;aspect-ratio:3/4;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.result-visual .link{justify-self:center}
.action:disabled{opacity:.45}
.account-btn{position:relative}
.lookpill{white-space:nowrap;flex-shrink:0}
@media (max-width:420px){.topbar-in{gap:4px}.topbar-in .spacer{min-width:4px}.lookpill{padding-left:12px;gap:6px}}
.account-btn.signed{color:var(--accent-text);background:var(--accent-soft)}
.account-btn.signed::after{content:"";position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--surface)}
.code-input{letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums;font-size:22px}
.account-card{display:grid;gap:6px;padding:14px 16px;border-radius:var(--r-m);background:var(--surface-2)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#" data-act="go" data-view="landing" aria-label="FitCart home"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 0 0 6 0l4 2 1.5 5-3 1V20H6.5v-8l-3-1L5 6z"/></svg></span>fitcart</a>
    <nav class="toptabs" aria-label="Main">
      <button data-act="go" data-view="home">Try on</button>
      <button data-act="go" data-view="wardrobe">Wardrobe</button>
      <button data-act="go" data-view="looks">Looks</button>
      <button data-act="go" data-view="pricing">Pricing</button>
    </nav>
    <div class="spacer"></div>
    <button class="iconbtn account-btn" data-act="account" id="accountBtn" aria-label="Sign in"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
    <button class="iconbtn" data-act="theme" aria-label="Switch light or dark theme"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    <button class="lookpill" data-act="go" data-view="builder" aria-label="Open your look"><svg class="icon s" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>My look <span class="count num" id="lookCount">0</span></button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabbar" aria-label="Main">
  <button data-act="go" data-view="home"><svg class="icon" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0 6 0l4 2 1.5 5-3 1V20H6.5v-8l-3-1L5 6z"/></svg>Try on<span class="badge-dot num" id="tabCount" hidden></span></button>
  <button data-act="go" data-view="wardrobe"><svg class="icon" viewBox="0 0 24 24"><path d="M12 6a2 2 0 1 1 2 2c-1 0-2 .8-2 2v1"/><path d="M12 11 3 17.5a1 1 0 0 0 .6 1.8h16.8a1 1 0 0 0 .6-1.8z"/></svg>Wardrobe</button>
  <button data-act="go" data-view="looks"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="9" r="2.5"/><path d="M7.5 17a4.5 4.5 0 0 1 9 0"/></svg>Looks</button>
</nav>

<dialog class="sheet" id="addSheet" aria-labelledby="addTitle"></dialog>
<dialog class="sheet" id="photoSheet" aria-labelledby="photoTitle"></dialog>
<dialog class="sheet" id="itemSheet" aria-labelledby="itemTitle"></dialog>
<dialog class="sheet" id="signinSheet" aria-labelledby="signinTitle"></dialog>
<div id="toastHost" role="status" aria-live="polite"></div>
<p class="sr" id="announcer" aria-live="polite"></p>
<input type="file" id="photoFile" accept="image/jpeg,image/png,image/webp" hidden>
<input type="file" id="itemFile" accept="image/jpeg,image/png,image/webp" hidden>
<script src="static/config.js"></script>
<script src="static/app.js"></script>
</body>
