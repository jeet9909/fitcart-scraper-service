[project]
name = "fitcart-scraper-service"
version = "0.1.0"
description = "Deployable product scraping API for FitCart using OpenAI and Bright Data MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=1.25,<2",
  "pillow>=11,<13",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
